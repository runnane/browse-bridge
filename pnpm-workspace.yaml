# pnpm 11 reads its build-scripts allowlist only from here. pnpm 10 ignores this
# key and skips Electron's postinstall; bin/browse-bridge then downloads the
# binary on first launch, so both work.
allowBuilds:
  electron: true

# BBR-78: GHSA-g3hv-75wg-m249 hits minimatch >=7 <11.0.1, pulled in by
# electron-builder 26.18.1 (no newer stable release). Scoped to the vulnerable
# range, so the 3.x and 5.x copies are left alone.
overrides:
  "minimatch@>=7 <11.0.1": ">=11.0.1"
